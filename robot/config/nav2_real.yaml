# ============================================================================
#  Nav2 参数 —— 真机（Mid-360 + LIO 里程计 + 先验地图重定位）
# ============================================================================
#  由 ros2_ws/src/rc_field_nav/config/nav2_omni_params.yaml 改写而来，差别：
#    * use_sim_time 全部 true -> false（真机用系统时钟）
#    * **删掉了整个 amcl 段**：本方案的 map->odom 由 prior_map_localizer.py
#      （3D 点云对先验地图做重定位）持续给出，不用 2D 激光 AMCL。
#    * 局部/全局代价地图的观测源从 LaserScan(/scan) 改成 PointCloud2
#      (/cloud_registered)：3D 雷达本来就有点云，不需要再投影成假 2D 激光；
#      体素层直接吃点云，动态障碍物也能清掉/标上。
#    * 保留全向底盘的关键设置：MPPI motion_model Omni、SmacPlanner2D、
#      min_y_velocity_threshold=0.001（否则横移指令会被清零）。
#
#  ★ 上车必改（robot-specific）：
#      - footprint：本文件按 0.60 x 0.46 m 方车写的
#      - max_velocity / max_accel（velocity_smoother）：按真车底盘能力改
#      - cmd_vel 主题名：Nav2 发 /cmd_vel，真车底盘驱动若是别的名字，
#        用 ros2 run topic_tools relay 或在底盘驱动里 remap
#      - 点云到 base_link 的外参由 TF 提供（LIO 直接发 odom->base_link，
#        若还有别的 link，需要 robot_state_publisher + URDF）
# ============================================================================

# ============================================================================
#  Nav2 参数：ROBOCON 场地 + 四全向轮(全向/麦克纳姆类)底盘
# ============================================================================
#  与 nav2_bringup 默认模板 (nav2_params.yaml, TurtleBot3 差速) 的关键差异：
#    * 全局 base_frame = base_link（本车不用 base_footprint）
#    * min_y_velocity_threshold: 0.001 —— 默认模板是 0.5！差速车不用 y 速度
#      所以无所谓，但全向车若沿用 0.5，横向速度指令会被直接清零，
#      表现为"只会前后走、不会平移"。
#    * 局部/全局代价地图用 footprint 多边形（0.60 x 0.46 m 矩形车，按规则启动区 700x700 定尺寸）
#    * controller_server 用 MPPI 且 motion_model: "Omni"（原生支持 vx/vy/ω）
#    * planner_server 用 SmacPlanner2D（holonomic，非混合 A*）
#    * AMCL 用 OmniMotionModel，并显式给出初始位姿，方便无 RViz 时启动
# ============================================================================

